aid: dianxiaomi
name: Dianxiaomi
description: 'Dianxiaomi (店小秘) is a free cross-border e-commerce ERP platform operated
  by Shenzhen Meiyunji Network Technology Co., Ltd., serving more than 1.8 million
  cross-border sellers worldwide. It unifies product listing and data collection,
  multi-platform order processing, warehouse and inventory management, procurement,
  financial and profit analytics, and customer service across 70+ marketplaces including
  AliExpress, Amazon, Shopee, Lazada, and TikTok Shop, with integrations to 1,700+
  logistics providers and 130+ overseas warehouses. The platform is user-facing SaaS;
  no public developer/API open platform is currently published.'
